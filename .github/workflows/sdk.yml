name: SDK validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install the test browser explicitly (SDK installs no browser)
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Select the installed Chromium for integration tests
        run: >-
          node --input-type=module -e "import { appendFileSync } from 'node:fs';
          import { chromium } from 'playwright-core';
          appendFileSync(process.env.GITHUB_ENV, 'STACKPRISM_TEST_BROWSER=' + chromium.executablePath() + '\n')"
      - run: bun run test:unit
      - run: bun run test:sdk
      - run: bun run lint
      - run: bun run typecheck
